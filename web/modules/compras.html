/* Um módulo incluído na área à direita notifica altura, sem comandar a navegação do menu. */

(function(){
 let ultima=0;
 const raiz=()=>document.querySelector('main')||document.querySelector('.app')||document.body;
 function altura(){const area=raiz(),r=area.getBoundingClientRect(),n=Math.ceil(Math.max(100,r.bottom));if(n!==ultima){ultima=n;window.parent.postMessage({tipo:'CSM_ALTURA_MODULO',altura:n},'*')}}
 if(typeof ResizeObserver!=='undefined')new ResizeObserver(altura).observe(raiz());
 window.addEventListener('load',altura);new MutationObserver(altura).observe(document.body,{childList:true,subtree:true,attributes:false});altura();})();
