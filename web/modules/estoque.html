<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--marrom:#071D2C;--creme:#FDF7EC;--texto:#071D2C;--borda:#D6BE9B;--muted:#284150;--verde:#31734a;--branco:#fff;--sombra:0 4px 20px #071D2C14}
    *{box-sizing:border-box}body{margin:0;background:var(--creme);color:var(--texto);font-family:Arial,Helvetica,sans-serif;font-size:14px}
    button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.46;cursor:not-allowed}
    .app{width:min(calc(100% - 28px),900px);margin:18px auto 30px}
    .barra{min-height:70px;background:var(--marrom);color:var(--creme);border-radius:12px;display:grid;grid-template-columns:110px 1fr 110px;align-items:center;padding:13px 18px}
    .barra h1{font-size:20px;letter-spacing:.3px;margin:0;text-align:center}.voltar{border:0;background:none;color:var(--creme);text-align:left;font-weight:700;padding:9px 0}
    .abas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
    .aba{background:#fff;border:1px solid var(--borda);color:var(--marrom);border-radius:8px;padding:12px 5px;font-weight:700;min-width:0}.aba.ativa{background:var(--marrom);color:var(--creme);border-color:var(--marrom)}
    .painel{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:16px;box-shadow:var(--sombra)}
    .titulo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.titulo h2{font-size:16px;margin:0}.sub{font-size:12px;color:var(--muted);line-height:1.45}
    .linha{display:flex;align-items:center;justify-content:space-between;gap:12px}.flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.crescer{flex:1;min-width:0}
    .pesquisa{padding:10px 12px;width:100%;max-width:360px;border:1px solid var(--borda);border-radius:8px;background:white;color:var(--texto)}
    .botao{background:#fff;color:var(--marrom);border:1px solid var(--marrom);border-radius:8px;padding:10px 14px;font-weight:700;white-space:normal}.botao.primario{background:var(--marrom);color:var(--creme)}.botao.leve{border-color:var(--borda)}.botao.perigo{color:#a32a28;border-color:#b95753}
    .linha-final{display:flex;justify-content:flex-end;gap:9px;margin-top:14px;flex-wrap:wrap}
    .rolagem{overflow:auto;max-height:calc(100dvh - 270px);min-height:130px;border:1px solid var(--borda);border-radius:8px;overscroll-behavior:contain}
    table{width:100%;border-collapse:collapse;font-size:12.5px}th{background:#F7EFE1;color:var(--marrom);position:sticky;top:0;text-align:left;z-index:1;padding:12px 10px;white-space:nowrap;border-bottom:1px solid var(--borda)}td{padding:10px;border-bottom:1px solid #eae3d9;vertical-align:middle;line-height:1.3}tr:last-child td{border-bottom:0}
    .direita{text-align:right}.centro{text-align:center}.num{font-variant-numeric:tabular-nums;white-space:nowrap}.descricao{max-width:205px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;display:block}
    .aviso{color:var(--muted);border-bottom:1px dotted var(--muted);cursor:help;font-weight:bold;margin-left:3px}.vazio{padding:20px;text-align:center;color:var(--muted)}
    .caixa{border:1px solid var(--borda);border-radius:10px;padding:13px;margin:10px 0}.caixa h3{margin:0 0 7px;font-size:15px}.caixa p{margin:0 0 8px;line-height:1.55}
    .campos{display:flex;gap:5px;align-items:center;justify-content:flex-start}.campo{min-width:0;width:78px;border:1px solid var(--borda);border-radius:6px;padding:8px 7px;background:#fff;color:var(--texto);font-size:13px}.campo:focus,.pesquisa:focus{outline:2px solid #a47d59;outline-offset:0}.campo:disabled{background:#f1eee9;color:#76675f}.emb-num{width:60px}.emb-un{width:62px}.preco{width:76px}.comp{width:72px}.rotulo-un{white-space:nowrap;font-size:11px;color:var(--muted)}
    .subabas{display:flex;gap:7px;margin:12px 0}.subaba{flex:1;border:1px solid var(--borda);border-radius:8px;padding:10px;background:#fff;color:var(--texto);font-weight:700}.subaba.ativa{background:#eee3d7}
    .status{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}.status.erro{color:#ab3528}.status.ok{color:var(--verde)}
    .etiqueta{padding:3px 7px;border:1px solid var(--borda);border-radius:30px;color:var(--muted);font-size:11px;white-space:nowrap}.etiqueta.ok{border-color:#a8c8b0;color:var(--verde)}
    .botao.mini{padding:6px 8px;font-size:11px}.modal-corpo input,.modal-corpo select{max-width:100%;min-width:0}.modal-corpo .formlinha{display:grid;grid-template-columns:1.5fr .65fr .7fr .7fr 30px;align-items:center;gap:5px;margin:6px 0}.modal-corpo .formlinha input,.modal-corpo .formlinha select{width:100%;border:1px solid var(--borda);border-radius:6px;padding:9px 5px;font-size:12px}.modal-corpo .formlinha label{font-size:10px;color:var(--muted)}.modal-corpo .formlinha .mini{padding:7px}.modal-corpo .campo-largo{width:100%;padding:10px;border:1px solid var(--borda);border-radius:7px}.modal-corpo .lado{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.modal-corpo .contagem-total{background:#F7EFE1;border-radius:8px;padding:10px;margin:10px 0;font-weight:700}.btn-conferir{display:inline-block;margin-top:5px}.btn-editar{border:1px solid var(--borda);background:white;color:var(--marrom);border-radius:5px;padding:4px 6px;margin-right:6px;vertical-align:middle;font-size:12px;cursor:pointer}.mov-lupa{border:1px solid var(--borda);background:white;border-radius:6px;padding:5px 8px;font-size:15px;min-width:32px}
    .saida-cab,.saida-linha{display:grid;grid-template-columns:minmax(0,1fr) 76px 75px 30px;gap:5px;align-items:center;margin:5px 0}.saida-cab{font-size:10px;color:var(--marrom);font-weight:bold}.saida-linha input,.saida-linha select{width:100%;min-width:0;padding:8px 5px;font-size:12px;border:1px solid var(--borda);border-radius:6px;min-height:34px;background:white}.saida-busca{position:relative;min-width:0}.saida-sugestoes{position:absolute;top:100%;left:0;right:0;z-index:8;max-height:170px;overflow:auto;background:white;border:1px solid var(--borda);border-radius:5px;box-shadow:0 8px 18px #0003}.saida-sugestoes button{display:block;border:0;background:white;color:var(--texto);font-size:11px;text-align:left;padding:8px 5px;width:100%;white-space:normal}.saida-sugestoes button.ativo,.saida-sugestoes button:hover{background:#FDF7EC}.saida-conferencia{font-size:11px;background:#f7f0e8;padding:9px;border-radius:7px;margin:12px 0;line-height:1.55}.saida-saldo{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;border-top:1px solid #e7d9c7;margin-top:6px;padding-top:5px}.saida-saldo.falta{color:#a32e28;font-weight:bold}.saida-linha .botao{padding:6px 4px;min-height:33px}.saida-linha select{font-size:11px}
    .lista-cards{display:none}.erro-principal{background:#fff2f0;border:1px solid #e2a29a;border-radius:8px;padding:12px;margin:10px 0;color:#9e271f;white-space:pre-line}
    dialog{border:0;border-radius:12px;padding:0;box-shadow:0 20px 70px #0005;width:min(92vw,490px);max-height:85dvh;color:var(--texto)}dialog[open]{position:fixed;top:50%;left:50%;right:auto;bottom:auto;margin:0;transform:translate(-50%,-50%)}dialog::backdrop{background:#24120eb2}.modal-corpo{padding:20px}.modal-corpo h3{margin:0 0 12px}.modal-corpo p{line-height:1.5}.modal-corpo textarea{width:100%;min-height:85px;padding:9px;border:1px solid var(--borda);border-radius:7px}
  
/* CABEÇALHO ÚNICO DESKTOP — mesmo padrão de título da FICHA TÉCNICA */
@media(min-width:850px){
 header,.barra,.head{min-height:80px!important;background:#071D2C!important;color:#FDF7EC!important;
  border-radius:12px!important;border-bottom:3px solid #E9A348!important;
  display:flex!important;align-items:center!important;justify-content:center!important;position:relative!important}
 header h1,.barra h1,.head h1{color:#FFCC66!important;font-size:22px!important;text-align:center!important;margin:0!important}
 header .voltar,.barra .voltar,.barra #voltarMenu,.head a.desktopOnly{position:absolute!important;left:16px!important;top:50%!important;transform:translateY(-50%)!important;
   color:#FDF7EC!important;background:transparent!important;text-decoration:none!important}
}
/* CASA SÃO MIGUEL | V13-11.8 TESTE | foco e maiúsculas em todos os módulos */
input:not([type=number]):not([type=date]):not([type=email]):not([type=url]):not([type=tel]):not([type=file]):not([type=password]), textarea {text-transform:uppercase}
input:focus,select:focus,textarea:focus,input:focus-visible,select:focus-visible,textarea:focus-visible {
  outline:2px solid #E9A348 !important; outline-offset:2px !important;
  border-color:#B87829 !important; box-shadow:0 0 0 3px rgba(233,163,72,.22) !important;
}

</style>

<style>@media(min-width:850px){html,body{overflow-y:hidden!important} .app{margin-top:22px!important}}</style>
<style>@media (min-width:651px){.voltar,#btnMenu,#voltarMenu,.head>a.desktopOnly{display:none!important} header,.barra,.head{margin-top:0!important}}</style>

</head>
<body>
<div class="app">
  <div class="barra"><button class="voltar" id="btnMenu">← Menu</button><h1>ESTOQUE</h1><span></span></div>
  <nav class="abas" aria-label="Áreas de estoque">
    <button data-aba="saldos" class="aba ativa">SALDOS</button><button data-aba="inventarios" class="aba">INVENTÁRIOS</button><button data-aba="movimentacoes" class="aba">MOVIMENTAÇÕES</button>
  </nav>
  <div id="erro" hidden class="erro-principal" role="alert"></div>
  <main id="conteudo" class="painel"><p class="vazio">Carregando dados de estoque...</p></main>
</div>
<dialog id="modal"><div class="modal-corpo" id="modalConteudo"></div></dialog><dialog id="confirmModal"><div class="modal-corpo" id="confirmModalContent"></div></dialog>
<script>
'use strict';
const APP_URL = '/';
const abaSolicitada=new URLSearchParams(window.location.search).get('aba');
const S={aba:['saldos','inventarios','movimentacoes'].includes(abaSolicitada)?abaSolicitada:'saldos',situacao:null,inv:null,sub:'a-contar',dadosInv:null,historico:[],movimentos:[],dirty:{},contagemTimer:null,camposRecentes:new Set(),salvando:null,pesquisa:''};
const el=id=>document.getElementById(id);
const escapar=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
function rpc(nome,...args){return new Promise((resolve,reject)=>{localApi.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e?.message||String(e))))[nome](...args);});}
function erro(msg){el('erro').hidden=!msg;if(msg)el('erro').textContent=msg;}
function notificacao(txt,classe=''){let n=el('estadoSalvamento');if(n){n.className='status '+classe;n.textContent=txt;} }
function botoes(t){return `<button class="botao ${t.cls||''}" data-action="${t.action}" ${t.extra||''}>${t.label}</button>`;}
function modal(titulo,html,acoes){const dlg=el('modal');el('modalConteudo').innerHTML=`<h3>${escapar(titulo)}</h3>${html}<div class="linha-final">${acoes.map(a=>`<button class="botao ${a.primary?'primario':''}" data-modal="${escapar(a.id)}">${escapar(a.label)}</button>`).join('')}</div>`;dlg.showModal();return new Promise(resolve=>{const run=e=>{const b=e.target.closest('[data-modal]');if(!b)return;dlg.removeEventListener('click',run);dlg.close();resolve({id:b.dataset.modal,text:el('justificativaModal')?.value||''});};dlg.addEventListener('click',run);dlg.addEventListener('cancel',function onCancel(e){e.preventDefault();dlg.removeEventListener('cancel',onCancel);dlg.removeEventListener('click',run);dlg.close();resolve({id:'voltar',text:''});},{once:true});});}
async function solicitar(titulo,descricao,botao='CONFIRMAR'){const dlg=el('confirmModal'),corpo=el('confirmModalContent');corpo.innerHTML=`<h3>${escapar(titulo)}</h3><p>${escapar(descricao)}</p><div class="linha-final"><button class="botao primario" data-confirm="sim">${escapar(botao)}</button><button class="botao leve" data-confirm="nao">VOLTAR</button></div>`;dlg.showModal();return await new Promise(resolve=>{const run=e=>{const b=e.target.closest('[data-confirm]');if(!b)return;dlg.removeEventListener('click',run);dlg.close();resolve(b.dataset.confirm==='sim');};dlg.addEventListener('click',run);dlg.addEventListener('cancel',function onCancel(e){e.preventDefault();dlg.removeEventListener('cancel',onCancel);dlg.removeEventListener('click',run);dlg.close();resolve(false);},{once:true});});}
async function carregar(){try{erro('');S.situacao=await rpc('estoqueSituacao');exibir();}catch(e){erro(e.message);}}
function exibir(){document.querySelectorAll('.aba').forEach(b=>b.classList.toggle('ativa',b.dataset.aba===S.aba));if(S.inv)exibirContagem();else if(S.aba==='saldos')exibirSaldos();else if(S.aba==='inventarios')exibirInventarios();else exibirMovimentos();}
function exibirSaldos(){const lista=(S.situacao?.saldos||[]).filter(x=>x.nome.toLocaleUpperCase('pt-BR').includes(S.pesquisa.toLocaleUpperCase('pt-BR')));
  el('conteudo').innerHTML=`<div class="titulo"><h2>POSIÇÃO ATUAL DO ESTOQUE</h2><span class="sub">Unidades de custo: G / ML / UN / CM / kWh</span></div><div style="margin-bottom:12px" class="flex"><input id="filtroSaldos" class="pesquisa" placeholder="Pesquisar insumo..." value="${escapar(S.pesquisa)}" aria-label="Pesquisar insumo">${S.situacao&&S.situacao.normalizacaoPendente?'<button class="botao leve mini" data-action="normalizar-referencias" title="Normalizar valores históricos de insumos sem controle físico">NORMALIZAR REFERÊNCIAS</button>':''}</div><div id="tabelaSaldos" class="rolagem desktop"><table><thead><tr><th>INSUMO</th><th class="direita">SALDO</th><th class="direita">CUSTO UN</th><th class="direita">VALOR TOTAL</th></tr></thead><tbody>${lista.map(x=>`<tr><td><div class="flex" style="flex-wrap:nowrap"><button class="btn-editar" type="button" data-action="editar-saldo" data-id="${escapar(x.id)}" title="Editar ${escapar(x.nome)}" aria-label="Editar ${escapar(x.nome)}">✎</button><span class="descricao" title="${escapar(x.nome)}">${escapar(x.nome)}${x.pendente?` <span class="aviso" title="Custo pendente para próxima entrada: ${escapar(x.pendente)}">ⓘ</span>`:''}</span></div></td><td class="direita num">${escapar(x.quantidade)}</td><td class="direita num">${escapar(x.custo)}</td><td class="direita num">${escapar(x.valor)}</td></tr>`).join('')||'<tr><td colspan="4" class="vazio">Nenhum insumo com histórico de movimentação.</td></tr>'}</tbody></table></div><div class="lista-cards">${lista.map(x=>`<div class="card-item"><div class="linha"><b title="${escapar(x.nome)}"><button class="btn-editar" data-action="editar-saldo" data-id="${escapar(x.id)}" title="Editar insumo">✎</button>${escapar(x.nome)}${x.pendente?` <span class="aviso" title="Custo pendente para próxima entrada: ${escapar(x.pendente)}">ⓘ</span>`:''}</b><strong>${escapar(x.quantidade)}</strong></div><div class="meta"><span>CUSTO UN: R$ ${escapar(x.custo)}</span><span>${x.controlaEstoque==='NÃO'?'':'VALOR TOTAL: '+escapar(x.valor)}</span></div></div>`).join('')||'<div class="vazio">Nenhum insumo com histórico de movimentação.</div>'}</div><p class="sub">Os saldos podem ser exibidos em KG/L para facilitar a leitura; o custo unitário continua calculado em G, ML ou UN e apresentado com seis casas decimais.</p>`;
  el('filtroSaldos').addEventListener('input',ev=>{const anterior=el('tabelaSaldos').scrollTop;S.pesquisa=ev.target.value;const foco=ev.target.selectionStart;exibirSaldos();el('filtroSaldos').focus();el('filtroSaldos').setSelectionRange(foco,foco);el('tabelaSaldos').scrollTop=anterior;});
}
function blocoInv(titulo,descricao,acao,botao,sufixo=''){return `<div class="caixa"><div class="linha"><h3>${titulo}</h3>${sufixo}</div><p class="sub">${descricao}</p>${acao?botoes({action:acao,label:botao,cls:'leve'}):''}</div>`;}
function exibirInventarios(){const s=S.situacao,ab=s.aberto;
  const abrir=ab?blocoInv('INVENTÁRIO EM ANDAMENTO','Retome a contagem e confira as diferenças antes da finalização.','continuar','CONTINUAR CONTAGEM',`<span class="etiqueta">${escapar(ab.id)}</span>`):blocoInv('INVENTÁRIO PERIÓDICO','Conte os insumos que já possuem movimentações e registre as diferenças encontradas.','iniciar-regular','INICIAR INVENTÁRIO');
  el('conteudo').innerHTML=`<div class="titulo"><h2>CONTROLE DE INVENTÁRIOS</h2></div>${abrir}${blocoInv('HISTÓRICO DE INVENTÁRIOS','Consulte inventários encerrados, inclusive cancelamentos justificados, e baixe relatórios em PDF.','historico','VER HISTÓRICO')}`;
}
function botoesMov(){return `<div class="flex" style="margin-bottom:10px">${S.situacao&&S.situacao.entradasManuais?botoes({action:"entrada-manual",label:"NOVA ENTRADA",cls:"leve"}):""}${S.situacao?botoes({action:"saida-manual",label:"NOVA SAÍDA",cls:"leve"}):""}</div>`;}
function exibirMovimentos(){el('conteudo').innerHTML='<div class="titulo"><h2>HISTÓRICO DE MOVIMENTAÇÕES</h2><span class="sub">Mais recentes primeiro</span></div><div class="rolagem"><p class="vazio">Carregando movimentações...</p></div>';
  rpc('estoqueListarMovimentacoes').then(l=>{S.movimentos=l;el('conteudo').innerHTML=`<div class="titulo"><h2>HISTÓRICO DE MOVIMENTAÇÕES</h2><span class="sub">Mais recentes primeiro</span></div>${l.some(m=>m.aviso)?'<div class="erro" role="alert">HÁ MOVIMENTAÇÕES COM VALOR MONETÁRIO INCONSISTENTE. Consulte os IDs indicados e verifique o banco original antes de qualquer correção. Nenhum dado foi modificado.</div>':''}${botoesMov()}<div class="rolagem desktop"><table><thead><tr><th>DATA</th><th>MOVIMENTAÇÃO</th><th>TIPO</th><th class="direita">VALOR TOTAL</th><th class="centro">DETALHES</th></tr></thead><tbody>${l.map(m=>`<tr><td class="num">${escapar(m.data)}</td><td>${escapar(m.movimento)}</td><td>${escapar(m.tipo)}</td><td class="direita num">${escapar(m.valor)}${m.aviso?`<div class="sub" style="color:#A02B2B">${escapar(m.aviso)}</div>`:''}</td><td class="centro"><button class="mov-lupa" data-action="detalhes" data-id="${escapar(m.id)}" aria-label="Ver detalhes">⌕</button></td></tr>`).join('')||'<tr><td colspan="5" class="vazio">Nenhuma movimentação registrada.</td></tr>'}</tbody></table></div><div class="lista-cards">${l.map(m=>`<div class="card-item"><div class="linha"><b>${escapar(m.data)} · ${escapar(m.movimento)}</b><button class="mov-lupa" data-action="detalhes" data-id="${escapar(m.id)}">⌕</button></div><div class="meta"><span>${escapar(m.tipo)}</span><strong>${escapar(m.valor)}</strong></div></div>`).join('')||'<p class="vazio">Nenhuma movimentação registrada.</p>'}</div>`;}).catch(e=>erro(e.message));
}
async function detalharMov(id){try{const d=await rpc('estoqueDetalhesMovimentacao',id);await modal('DETALHES DA MOVIMENTAÇÃO',`<p class="sub">${escapar(d.data)} · ${escapar(d.movimento)} · ${escapar(d.tipo)}<br>Origem: ${escapar(d.referencia)}</p><div class="rolagem" style="max-height:330px"><table><thead><tr><th>INSUMO</th><th>QUANTIDADE</th><th>IMPACTO</th></tr></thead><tbody>${d.itens.map(i=>`<tr><td>${escapar(i.nome)}${i.custoPendente!=='R$ 0,00'?`<div class="sub">Custo pendente: ${escapar(i.custoPendente)}</div>`:''}</td><td>${escapar(i.quantidade)}</td><td>${escapar(i.impacto)}</td></tr>`).join('')}</tbody></table></div><p><b>Impacto total no estoque: ${escapar(d.valor)}</b></p>`,[{id:'fechar',label:'FECHAR',primary:true}]);}catch(e){erro(e.message);}}
async function historico(){try{const lista=await rpc('estoqueListarInventarios');const html=`<div class="rolagem" style="max-height:400px"><table><thead><tr><th>ID</th><th>TIPO</th><th>SITUAÇÃO</th><th></th></tr></thead><tbody>${lista.map(i=>`<tr><td>${escapar(i.id)}<span class="sub" style="display:block">${escapar(i.fim||i.inicio)}</span></td><td>${escapar(i.tipo)}</td><td>${escapar(i.status)}</td><td><button class="botao leve" data-action="consulta-hist" data-id="${escapar(i.id)}">CONSULTAR</button></td></tr>`).join('')}</tbody></table></div>`;el('conteudo').innerHTML=`<div class="titulo"><h2>HISTÓRICO DE INVENTÁRIOS</h2>${botoes({action:'voltar-inventarios',label:'VOLTAR',cls:'leve'})}</div>${html}`;}catch(e){erro(e.message);}}
async function abrirInventario(tipo){try{erro('');const x=await rpc('estoqueAbrirInventario',tipo);await carregarInventario(x.id);}catch(e){erro(e.message);}}
async function carregarInventario(id){try{erro('');S.dadosInv=await rpc('estoqueDadosInventario',id);S.inv=id;S.sub='a-contar';S.dirty={};S.camposRecentes=new Set();exibir();}catch(e){erro(e.message);}}
function campoMarkup(i,nome,valor,classe='',tipo='text'){
  const locked=i.gravado||S.dadosInv.status!=='ABERTO'||(nome==='contagem'&&S.dadosInv.tipo!=='INICIAL');
  return `<input data-id="${escapar(i.id)}" data-campo="${nome}" class="campo ${classe}" type="${tipo}" inputmode="decimal" aria-label="${escapar(nome+' de '+i.nome)}" autocomplete="off" value="${escapar(valor)}" ${locked?'disabled':''}>`;
}

function registrarAlteracao(target,finalizou=false){const id=target.dataset.id,chave=target.dataset.campo,it=S.dadosInv.itens.find(x=>x.id===id);if(!it||it.gravado)return;

async function salvarRascunho(){clearTimeout(S.contagemTimer);if(S.salvando){await S.salvando;if(Object.keys(S.dirty).length) return salvarRascunho();return;}

async function abrirDetalhesPacotes(id){
  try{
    erro('');await salvarRascunho();

    if(!i||S.dadosInv.tipo==='INICIAL')return;
    const editavel=S.dadosInv.status==='ABERTO'&&!i.gravado;
    let linhas=(i.detalhes||[]).map(l=>({...l}));
    if(!linhas.length)linhas=[{quantidade:i.contagem==='0'?'0':'1',tamanho:i.contagem==='0'?'1':(i.contagem||'1'),unidade:i.unidade}];
    const dlg=el('modal'),body=prepararCorpoModal(),momento=new Date().toISOString();
    body.innerHTML=`<h3>CONTAGEM POR EMBALAGENS</h3><p><strong>${escapar(i.nome)}</strong><br><span class="sub">A unidade de referência é ${escapar(i.unidade)}. Adicione embalagens fechadas, parciais ou quantidades avulsas.</span></p><div class="formlinha"><label>QTD. PACOTES</label><label>TAMANHO</label><label>UNID.</label><label></label><label></label></div><div id="linhasPacotes"></div><div id="previsaoPacotes" class="contagem-total"></div>${editavel?'<button class="botao leve" type="button" id="addPacote">+ ADICIONAR EMBALAGEM / AVULSO</button>':''}<div class="linha-final">${editavel?'<button class="botao primario" id="gravarPacotes">SALVAR CONTAGEM</button>':''}<button class="botao leve" id="fecharPacotes">FECHAR</button></div>`;
    let salvando=false;
    function desenhar(){
      el('linhasPacotes').innerHTML=linhas.map((l,index)=>`<div class="formlinha" data-index="${index}"><input aria-label="Quantidade de pacotes" data-valor="quantidade" inputmode="decimal" value="${escapar(l.quantidade)}" ${!editavel?'disabled':''}><input aria-label="Tamanho" data-valor="tamanho" inputmode="decimal" value="${escapar(l.tamanho)}" ${!editavel?'disabled':''}><select data-valor="unidade" ${!editavel?'disabled':''}>${criarOpcoesUnidades(i.unidade,l.unidade)}</select><span></span>${editavel?`<button type="button" class="botao leve mini" data-remover="${index}" aria-label="Remover embalagem">×</button>`:'<span></span>'}</div>`).join('');
      atualizarPrevia();
    }
    function atualizarPrevia(){
      let soma=0,validos=true;
      for(const l of linhas){const q=Number(String(l.quantidade).replace(',','.')),t=Number(String(l.tamanho).replace(',','.'));
        const fator=(l.unidade==='KG'||l.unidade==='L')?1000:l.unidade==='M'?100:1;
        if(!Number.isFinite(q)||!Number.isFinite(t)||q<0||t<=0||String(l.quantidade).trim()===''){validos=false;continue;}soma+=q*t*fator;}
      el('previsaoPacotes').textContent=validos&&linhas.length?'CONTAGEM CALCULADA: '+soma.toLocaleString('pt-BR',{maximumFractionDigits:3})+' '+i.unidade:'Confira os valores das embalagens.';
    }
    function sincronizar(){body.querySelectorAll('#linhasPacotes .formlinha[data-index]').forEach(row=>{const l=linhas[Number(row.dataset.index)];row.querySelectorAll('[data-valor]').forEach(inp=>l[inp.dataset.valor]=inp.value);});}
    body.addEventListener('input',e=>{if(e.target.closest('#linhasPacotes')){sincronizar();atualizarPrevia();}});
    // Em seletores e entradas, redesenhamos somente quando o valor foi confirmado.
    body.addEventListener('change',e=>{if(e.target.closest('#linhasPacotes')){sincronizar();atualizarPrevia();}});
    body.addEventListener('click',async e=>{
      if(e.target.closest('#fecharPacotes')){if(!salvando)dlg.close();return;}
      if(e.target.closest('#addPacote')){sincronizar();linhas.push({quantidade:'1',tamanho:'1',unidade:i.unidade});desenhar();return;}
      const rm=e.target.closest('[data-remover]');if(rm){sincronizar();linhas.splice(Number(rm.dataset.remover),1);desenhar();return;}
      if(e.target.closest('#gravarPacotes')&&!salvando){
        sincronizar();salvando=true;el('gravarPacotes').disabled=true;
        try{await rpc('estoqueSalvarDetalhesContagem',S.inv,id,linhas,i.compensar,momento);
          dlg.close();S.dadosInv=await rpc('estoqueDadosInventario',S.inv);exibir();}
        catch(ex){erro(ex.message);salvando=false;const b=el('gravarPacotes');if(b)b.disabled=false;}
      }
    });
    desenhar();dlg.showModal();
  }catch(ex){erro(ex.message);}
}

// Confirmação dentro da janela atual: não abre segundo dialog sobre o primeiro.

<script>
/* Normalização visual e efetiva de texto livre. Campos estruturados (datas, valores, e-mails, XML) preservam seu formato. */
document.addEventListener('input',function(ev){
 const e=ev.target;if(!e || !e.matches || !e.matches('textarea,input[type=text],input:not([type]) ,input[type=search]'))return;
 if(e.readOnly||e.disabled||e.dataset.csmCase==='original'||e.inputMode==='decimal'||e.inputMode==='numeric'||e.type==='email')return;
 const t=e.value,novo=t.toLocaleUpperCase('pt-BR');if(t===novo)return;
 const a=e.selectionStart,b=e.selectionEnd;e.value=novo;
 try{if(a!==null&&b!==null)e.setSelectionRange(a,b)}catch(_){}
},true);
/* Um módulo incluído na área à direita notifica altura, sem comandar a navegação do menu. */

(function(){
 let ultima=0;
 const raiz=()=>document.querySelector('main')||document.querySelector('.app')||document.body;
 function altura(){const area=raiz(),r=area.getBoundingClientRect(),n=Math.ceil(Math.max(100,r.bottom));if(n!==ultima){ultima=n;window.parent.postMessage({tipo:'CSM_ALTURA_MODULO',altura:n},'*')}}
 if(typeof ResizeObserver!=='undefined')new ResizeObserver(altura).observe(raiz());
 window.addEventListener('load',altura);new MutationObserver(altura).observe(document.body,{childList:true,subtree:true,attributes:false});altura();})();

</script>
